  <script>
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      // Đã có bản cũ đang chạy mà bản mới tiếp quản thì mời người dùng tải lại (lần cài đầu tiên thì không cần)
      const hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!hadController || document.querySelector('.update-bar')) return;
        const bar = document.createElement('button');
        bar.type = 'button';
        bar.className = 'update-bar';
        bar.textContent = '✨ Có bản mới của hiuhf0, bấm để cập nhật';
        bar.addEventListener('click', () => location.reload());
        document.body.appendChild(bar);
      });
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
