name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    name: Kiểm thử đơn vị và dữ liệu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test

  e2e:
    name: Kiểm thử trình duyệt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: tests/e2e
      - run: node tests/e2e/run.js
        env:
          CHROME_PATH: /usr/bin/google-chrome
